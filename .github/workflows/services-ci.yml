name: Services CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select base revision
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build service matrix
        id: detect
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          matrix="$(python3 scripts/ci/detect_changed_services.py --base "$BASE_SHA" --head "$GITHUB_SHA")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          has_changes="$(MATRIX="$matrix" python3 -c 'import json, os; print(str(bool(json.loads(os.environ["MATRIX"])["include"])).lower())')"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  service-ci:
    name: Validate ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/_service-ci.yml
    with:
      service_name: ${{ matrix.name }}
      service_path: ${{ matrix.path }}
      language: ${{ matrix.language }}
      runtime_version: ${{ matrix.runtime_version }}
      export_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_OCIR_PUBLISH == 'true' }}

  publish:
    name: Publish ${{ matrix.name }}
    needs: [changes, service-ci]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.has_changes == 'true' && vars.ENABLE_OCIR_PUBLISH == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/_publish-service.yml
    with:
      service_name: ${{ matrix.name }}
      ocir_registry: ${{ vars.OCIR_REGISTRY }}
      ocir_namespace: ${{ vars.OCIR_NAMESPACE }}
      ocir_repository_prefix: ${{ vars.OCIR_REPOSITORY_PREFIX }}
    secrets:
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
      OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}

  promote-gitops:
    name: Promote all changed images
    needs: [changes, publish]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success' &&
      vars.ENABLE_OCIR_PUBLISH == 'true' &&
      vars.ENABLE_GITOPS_PROMOTION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JulioDinizN/tech-challenge-fase-4-gitops
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          path: gitops

      - name: Download all promotion descriptors
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: promotion-*
          path: promotions
          merge-multiple: true

      - name: Update desired image tags
        run: |
          python3 scripts/ci/promote_gitops.py \
            --gitops-root gitops \
            --promotions promotions

      - name: Commit one atomic GitOps promotion
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git -C gitops diff --check
          git -C gitops config user.name "togglemaster-ci"
          git -C gitops config user.email "togglemaster-ci@users.noreply.github.com"
          git -C gitops add apps
          if git -C gitops diff --cached --quiet; then
            echo "GitOps already contains the requested image tags"
            exit 0
          fi
          git -C gitops commit -m "deploy: promote images from ${SOURCE_SHA:0:12}"
          git -C gitops push origin HEAD:main

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, service-ci, publish, promote-gitops]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate matrix result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVICES_RESULT: ${{ needs.service-ci.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PROMOTION_RESULT: ${{ needs.promote-gitops.result }}
        run: |
          test "$CHANGES_RESULT" == "success"
          test "$SERVICES_RESULT" == "success" -o "$SERVICES_RESULT" == "skipped"
          test "$PUBLISH_RESULT" == "success" -o "$PUBLISH_RESULT" == "skipped"
          test "$PROMOTION_RESULT" == "success" -o "$PROMOTION_RESULT" == "skipped"
