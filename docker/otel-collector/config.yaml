# OpenTelemetry Collector do ambiente local (Docker Compose).
# Os serviços enviam OTLP; o Collector roteia métricas ao Prometheus, logs ao Loki
# e traces ao Jaeger local. newrelic.yaml adiciona o APM quando houver license key.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: local
        action: upsert
  batch: {}

exporters:
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp_http/loki]
